<style>

</style></head><body>
<aside>
<h1>Dam Safety Map Composer</h1>
<h2>MAIN MAP</h2><div id="fm"></div>

<label>Logo box – line 2 text (optional)</label><textarea id="f_org2" rows="2">Dam Rehabilitation And Improvement Project</textarea><small>Logo for line 2, e.g. DRIP (optional):</small><input type="file" id="f_lg2" accept="image/*">

<button onclick="print()">Print / PDF</button><button class="s" onclick="png()">Download PNG</button>

</aside>
<main><div id="sheet">
<div class="l"><div id="frame"><div id="map"></div><svg id="grat"></svg></div></div>

</div></div></main>
<script>
const $=id=>document.getElementById(id),P=34;

vuln:['#1a9641','#a6d96a','#ffffbf','#fdae61','#d7191c'],arr:['#d73027','#fc8d59','#fee090','#e0f3f8','#91bfdb','#4575b4'],
arrt:['#a52a2a','#ff0000','#ff7f2a','#ffbf00','#ffff00','#c8f046','#32b432','#145a32'],gen:['#440154','#3b528b','#21908d','#5dc863','#fde725']};

arr:{n:'Flood arrival time map',u:'hr',pal:PAL.arrt,st:{color:'#4575b4',fillColor:'#91bfdb',fillOpacity:.5,weight:1}},
vuln:{n:'Vulnerability map',u:'index',pal:PAL.vuln,names:1,st:{color:'#555',fillColor:'#d7191c',fillOpacity:.6,weight:1}},
ext:{n:'Inundation extent (polygon)',u:'',pal:PAL.depth,st:{color:'#0a6cff',fillColor:'#4da3ff',fillOpacity:.5,weight:1.5}},
vic:{n:'Vicinity / settlements',u:'',pal:PAL.gen,st:{color:'#ff3b30',fillColor:'#ff3b30',fillOpacity:.15,weight:2}},
catch:{n:'Catchment boundary',u:'',pal:PAL.gen,st:{color:'#ff8c00',fill:false,weight:3,dashArray:'8 5'}},
river:{n:'River / stream network',u:'',pal:PAL.depth,st:{color:'#00d5ff',weight:2.5,fill:false}},

other:{n:'Other raster / vector',u:'',pal:PAL.gen,st:{color:'#7b2cbf',fillColor:'#c77dff',fillOpacity:.5,weight:1.5}}};
/* ---- layer input forms: main map (prefix '') and locator map (prefix 'l') ---- */
const FORM=k=>`<label>Layer type</label><select id="${k}type">${Object.entries(T).map(([a,v])=>`<option value="${a}">${v.n}</option>`).join('')}</select>
<label>File(s) – .tif/.tiff, .zip shapefile, or .shp+.dbf+.prj, .geojson</label>
<input type="file" id="${k}files" multiple accept=".tif,.tiff,.zip,.shp,.dbf,.prj,.shx,.json,.geojson">
<label>Number of classes (5–10)</label><input type="number" id="${k}ncls" value="5" min="5" max="10">
<label>Custom breaks (optional, comma separated)</label><input type="text" id="${k}brk" placeholder="e.g. 0.5,1,2,4,8">
<label>Raster coordinate system</label><select id="${k}crs">${CRSO}</select>
<label>Colour scheme (map values)</label><select id="${k}pal"><option value="">Default for layer type</option>${Object.entries(PALN).map(([a,v])=>`<option value="${a}">${v}</option>`).join('')}</select>
<label style="font-weight:400"><input type="checkbox" id="${k}rev"> Reverse colours</label>
<button onclick="addLayer('${k}')">Add layer${k?' to locator':''}</button><div id="${k}msg" class="msg"></div>`;
$('fm').innerHTML=FORM('');$('fl').innerHTML=FORM('l');
const map=L.map('map',{zoomControl:true,zoomSnap:.25}).setView([22,79],5);
map.createPane('rast').style.zIndex=350;
const BS={g:['https://mt{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',{subdomains:'0123',maxZoom:20,attribution:'© Google'}],
e:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,crossOrigin:true,attribution:'© Esri'}],
o:['https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,crossOrigin:true,attribution:'© OpenStreetMap'}]};
const mkB=()=>Object.fromEntries(Object.entries(BS).map(([k,[u,o]])=>[k,L.tileLayer(u,o)]));
const BL=mkB();let cur=BL.g.addTo(map);
/* ---- locator map: same base + layers, box = main map extent ---- */
const loc=L.map('locm',{zoomControl:false,attributionControl:false,zoomSnap:.25}).setView([22,79],3);loc.createPane('rast').style.zIndex=350;
const BL2=mkB();let cur2=BL2.g.addTo(loc);const LG=L.layerGroup().addTo(loc),RC=L.rectangle(map.getBounds(),{color:'#000',weight:1.5,fill:false,interactive:false}).addTo(loc);
$('base').onchange=e=>{map.removeLayer(cur);cur=BL[e.target.value].addTo(map);$('bn').textContent=e.target.selectedOptions[0].text};
$('lbase').onchange=e=>{loc.removeLayer(cur2);cur2=BL2[e.target.value].addTo(loc)};
function locFit(){loc.invalidateSize();const vs=[...LL.filter(o=>o.vis),...($('lmir').checked?LY.filter(o=>o.vis):[])];if(!vs.length)return loc.setView(map.getCenter(),Math.max(0,map.getZoom()-3),{animate:false});
const b=L.latLngBounds([]);vs.forEach(o=>b.extend(L.latLngBounds(o.bounds)));loc.fitBounds(b.pad(.4),{animate:false})}
function locSync(){LG.clearLayers();if($('lmir').checked)LY.filter(o=>o.vis).forEach(o=>{if(o.raster)LG.addLayer(L.imageOverlay(o.url,o.bounds,{pane:'rast',opacity:o.lyr.options.opacity,interactive:false}));
else{const s=o.lyr.options.style;LG.addLayer(L.geoJSON(o.gj,{style:f=>({...s(f),weight:Math.min(s(f).weight||1,1.5)}),pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:3}),interactive:false}))}});locFit()}
/* ---- scale bar (bottom right), measured from the main map ---- */
const flo=x=>{const p=10**Math.floor(Math.log10(x)),r=x/p;return(r>=5?5:r>=2?2:1)*p};
function scl(){const sz=map.getSize(),y=sz.y/2,mpp=map.distance(map.containerPointToLatLng([sz.x/2-50,y]),map.containerPointToLatLng([sz.x/2+50,y]))/100,sv=$('sclsvg'),W=sv.clientWidth,bw=W-56;
if(!(mpp>0)||bw<=0)return;const tot=flo(bw*mpp),px=tot/mpp,km=tot>=1000,u=km?'km':'m',f=v=>km?+(v/1000).toFixed(3):Math.round(v),x0=(W-px)/2;
let h='';for(let k=0;k<4;k++)h+=`<rect x="${x0+k*px/4}" y="21" width="${px/4}" height="9" fill="${k%2?'#fff':'#000'}" stroke="#000" stroke-width="1"/>`;
h+=`<text x="${x0}" y="15" text-anchor="middle">0</text><text x="${x0+px/2}" y="15" text-anchor="middle">${f(tot/2)}</text><text x="${x0+px}" y="15" text-anchor="middle">${f(tot)} ${u}</text>`;sv.innerHTML=h}
function upd(){grat();scl();RC.setBounds(map.getBounds())}
/* ---- sheet text fields + logos ---- */
const og2=()=>$('og2').style.display=$('f_org2').value.trim()||$('lg2').style.display!='none'?'':'none';
['tank','div','title','org1','org2'].forEach(k=>{const e=$('f_'+k);try{const s=localStorage.getItem('eap_'+k);if(s!==null)e.value=s}catch(_){}
(e.oninput=()=>{$('v_'+k).textContent=e.value;try{localStorage.setItem('eap_'+k,e.value)}catch(_){};og2()})()});
['1','2'].forEach(n=>$('f_lg'+n).onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=$('lg'+n);i.onerror=null;i.src=r.result;i.style.display='';og2()};r.readAsDataURL(f)});
const NA=L.control({position:'topright'});NA.onAdd=()=>{const d=L.DomUtil.create('div','na');
d.innerHTML='N<svg width="26" height="38" viewBox="0 0 26 38"><polygon points="13,0 25,36 13,28 1,36" fill="#000"/><polygon points="13,0 13,28 1,36" fill="#fff" stroke="#000"/></svg>';return d};NA.addTo(map);
/* ---- graticule frame ---- */
const nice=x=>{const p=10**Math.floor(Math.log10(x)),r=x/p;return(r<1.5?1:r<3.5?2:r<7.5?5:10)*p};
function grat(){const sz=map.getSize(),b=map.getBounds(),s=$('grat');s.setAttribute('width',sz.x+2*P);s.setAttribute('height',sz.y+2*P);
const st=nice((b.getEast()-b.getWest())/4),d=Math.max(0,Math.min(6,-Math.floor(Math.log10(st)))),cl=b.getCenter(),
f=(v,a,c)=>Math.abs(v).toFixed(d)+'°'+(v<0?c:a);let h=`<rect x="${P}" y="${P}" width="${sz.x}" height="${sz.y}" fill="none" stroke="#000" stroke-width="2"/>`;
for(let k=Math.ceil(b.getWest()/st);k*st<=b.getEast();k++){const v=k*st,x=map.latLngToContainerPoint([cl.lat,v]).x+P;
h+=`<line x1="${x}" y1="${P}" x2="${x}" y2="${P+sz.y}"/><text x="${x}" y="${P-8}" text-anchor="middle">${f(v,'E','W')}</text><text x="${x}" y="${P+sz.y+20}" text-anchor="middle">${f(v,'E','W')}</text>`}
const sl=Math.max(st,nice((b.getNorth()-b.getSouth())/4));
for(let k=Math.ceil(b.getSouth()/st);k*st<=b.getNorth();k++){const v=k*st,y=map.latLngToContainerPoint([v,cl.lng]).y+P;
h+=`<line x1="${P}" y1="${y}" x2="${P+sz.x}" y2="${y}"/><text transform="translate(${P-8},${y}) rotate(-90)" text-anchor="middle">${f(v,'N','S')}</text><text transform="translate(${P+sz.x+16},${y}) rotate(-90)" text-anchor="middle">${f(v,'N','S')}</text>`}

/* ---- classification ---- */
const hex=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16));
function col(pal,t){const n=pal.length-1,x=Math.min(Math.max(t,0),1)*n,i=Math.min(Math.floor(x),n-1),a=hex(pal[i]),b=hex(pal[i+1]);return a.map((v,k)=>Math.round(v+(b[k]-v)*(x-i)))}
const rgb=c=>`rgb(${c})`;
function classes(min,max,t){if(!(max>min))max=min+1e-6;const cu=(t.bk??$('brk').value).split(',').map(parseFloat).filter(x=>isFinite(x));let e;
if(cu.length){e=[min,...cu.filter(x=>x>min&&x<max).sort((a,b)=>a-b),max]}else{const n=Math.min(10,Math.max(5,+(t.nc??$('ncls').value)||5)),s=(max-min)/n;e=Array.from({length:n+1},(_,k)=>k==n?max:min+k*s)}

const n=e.length-1,C=Array.from({length:n},(_,k)=>col(t.pal,n==1?0:k/(n-1))),dd=Math.max((max-min)<5?2:(max-min)<50?1:0,...cu.map(x=>(String(x).split('.')[1]||'').length)),f=x=>(+x.toFixed(dd)).toString();
const L2=e.slice(0,-1).map((a,k)=>(t.names&&n==5?VN[k]+': ':'')+`${f(a)} – ${f(e[k+1])}${t.u?' '+t.u:''}`);

/* ---- loaders ---- */
async function mkRaster(f,t,crs){
const img=await(await GeoTIFF.fromArrayBuffer(await f.arrayBuffer())).getImage(),W=img.getWidth(),H=img.getHeight(),bb=img.getBoundingBox(),gk=img.getGeoKeys()||{};
const sc=Math.min(1,1200/Math.max(W,H)),w=Math.max(1,Math.round(W*sc)),h=Math.max(1,Math.round(H*sc));
const d=(await img.readRasters({samples:[0],width:w,height:h,resampleMethod:'nearest'}))[0],nd=img.getGDALNoData();
let def=crsDef(crs===undefined?$('crs').value:crs);const fg=def=='GEO';if(fg)def='';const ep=gk.ProjectedCSTypeGeoKey;
if(!def&&ep){if(ep>=32601&&ep<=32660)def=`+proj=utm +zone=${ep-32600} +datum=WGS84 +units=m`;else if(ep>=32701&&ep<=32760)def=`+proj=utm +zone=${ep-32700} +south +datum=WGS84 +units=m`;else if(ep==3857)def='EPSG:3857'}

if(geo)lo=[...bb];else for(let i=0;i<=20;i++)for(let j=0;j<=20;j++){const p=pj.inverse([bb[0]+(bb[2]-bb[0])*i/20,bb[1]+(bb[3]-bb[1])*j/20]);lo=[Math.min(lo[0],p[0]),Math.min(lo[1],p[1]),Math.max(lo[2],p[0]),Math.max(lo[3],p[1])]}
const ok=v=>isFinite(v)&&v!==nd&&Math.abs(v)<1e30&&(!t.pos||v>0);let mn=1e30,mx=-1e30;
